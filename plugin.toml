id = "dengliu.gitlink"
name = "GitLink"
version = "0.1.2"
icon = "icons/gitlink-logo.svg"
description = "Opens or copies a remote link (or Markdown link) to a file, line selection, directory or commit on GitHub, GitLab, Bitbucket, Codeberg, Forgejo, Gitea, Gitee, Gogs, Azure DevOps, sourcehut, Gerrit, or a custom URL template."
authors = ["Deng Liu"]
homepage = "https://github.com/dengliu/openidea-gitlink"
license = "MIT"
change-notes = """
0.1.2 — add custom GitLink plugin icon (icons/gitlink-logo.svg).
0.1.1 — resolve SSH Host aliases from ~/.ssh/config and hostAliases setting, and normalize SSH-only endpoints (ssh.github.com, altssh.gitlab.com, ssh.dev.azure.com).
"""
categories = ["vcs", "tools"]
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-command:*"]

[capabilities]
required = ["project.read", "editor.read", "vcs.read", "clipboard"]
optional = ["fs.read:~/.ssh/config"]

[[contributes.commands]]
id = "open"
title = "GitLink: Open in Browser"
category = "GitLink"

[[contributes.commands]]
id = "copy"
title = "GitLink: Copy Link"
category = "GitLink"

[[contributes.commands]]
id = "copy-markdown"
title = "GitLink: Copy Markdown Link"
category = "GitLink"

[[contributes.commands]]
id = "open-commit"
title = "GitLink: Open Commit in Browser"
category = "GitLink"

[[contributes.commands]]
id = "copy-commit"
title = "GitLink: Copy Commit Link"
category = "GitLink"

[[contributes.commands]]
id = "copy-commit-markdown"
title = "GitLink: Copy Commit Markdown Link"
category = "GitLink"

[[contributes.menus]]
menu = "editor.context"
command = "open"

[[contributes.menus]]
menu = "editor.context"
command = "copy"

[[contributes.menus]]
menu = "editor.context"
command = "copy-markdown"

[[contributes.menus]]
menu = "projectView.context"
command = "open"

[[contributes.menus]]
menu = "projectView.context"
command = "copy"

[[contributes.menus]]
menu = "projectView.context"
command = "copy-markdown"

[[contributes.menus]]
menu = "editorTab.context"
command = "open"

[[contributes.menus]]
menu = "editorTab.context"
command = "copy"

[[contributes.menus]]
menu = "editorTab.context"
command = "copy-markdown"

[[contributes.menus]]
menu = "tools"
command = "open"

[[contributes.menus]]
menu = "tools"
command = "copy"

[[contributes.menus]]
menu = "tools"
command = "copy-markdown"

[contributes.settings]
title = "GitLink"
schema = "settings.schema.json"
