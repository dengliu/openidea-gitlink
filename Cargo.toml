[package]
name = "openidea-plugin-dengliu-gitlink"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", rev = "d4a90a3243fc521c8f6b8963afdb4445a7f9ebcb" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
